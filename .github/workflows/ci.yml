name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  test:
    name: regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check -r requirements-lock.txt

      # Gate on breakage, not on taste: syntax errors, undefined names, unreachable
      # code. Style is not enforced here, so this step can never fail on formatting.
      - name: Static check (syntax and undefined names)
        run: |
          pip install ruff
          ruff check --select=E9,F63,F7,F82 --output-format=full .

      - name: Run regression suite
        run: python -m pytest -q

  image:
    name: docker build
    runs-on: ubuntu-latest
    # The image only proves the Dockerfile builds; it is not published from here.
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t shitu:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name shitu-smoke -p 8767:8767 \
            -e APP_PUBLIC_ORIGIN=http://127.0.0.1:8767 shitu:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8767/api/healthz; then echo "healthy"; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8767/api/healthz
          docker rm -f shitu-smoke
