<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅策 TravelPlan Agent · 全能规划助手</title>
<style>
  :root{
    --bg:#eef2f7; --card:#fff; --line:#e2e8f0; --line-soft:#f1f5f9;
    --text:#0f172a; --text-2:#334155; --muted:#64748b; --muted-2:#94a3b8;
    --brand:#0284c7; --brand-2:#06b6d4;
    --a:#059669; --a-bg:#ecfdf5;
    --b:#2563eb; --b-bg:#eff6ff;
    --c:#d97706; --c-bg:#fffbeb;
    --r:#dc2626; --r-bg:#fef2f2;
    --d:#64748b; --d-bg:#f1f5f9;
    --radius:14px;
    --shadow:0 1px 2px rgba(15,23,42,.04), 0 8px 24px -8px rgba(15,23,42,.10);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.65;font-size:14px;-webkit-font-smoothing:antialiased}

  /* 顶部 */
  .topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:18px;padding:0 22px;height:60px;background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:-.01em;flex:none}
  .brand .dot{width:26px;height:26px;border-radius:8px;flex:none;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff;font-size:13px}
  .brand small{font-weight:400;color:var(--muted-2);font-size:11px;letter-spacing:0}
  .sources{display:flex;gap:6px;flex-wrap:wrap}
  .src-chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text-2);background:var(--line-soft);border:1px solid var(--line);padding:3px 9px;border-radius:99px;white-space:nowrap}
  .src-chip i{width:6px;height:6px;border-radius:50%;background:var(--a);font-style:normal;flex:none;box-shadow:0 0 0 2px rgba(5,150,105,.15)}
  .src-chip.warn i{background:var(--c);box-shadow:0 0 0 2px rgba(217,119,6,.15)}
  .src-chip.err i{background:var(--r);box-shadow:0 0 0 2px rgba(220,38,38,.15)}
  .reset-btn{margin-left:auto;font-family:inherit;font-size:11.5px;font-weight:600;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer;transition:all .16s;flex:none}
  .reset-btn:hover{color:var(--text);border-color:var(--muted-2)}

  /* 布局 */
  .shell{max-width:1560px;margin:0 auto;padding:20px}
  .layout{display:grid;grid-template-columns:390px 1fr;gap:18px;align-items:start}
  @media(max-width:1180px){.layout{grid-template-columns:1fr}.left-col{position:static!important;height:auto!important}.chat{max-height:380px}}

  /* 左栏 */
  .left-col{position:sticky;top:80px;height:calc(100vh - 100px);display:flex;flex-direction:column;gap:14px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .chat-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
  .panel-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;font-weight:600;color:var(--text-2);letter-spacing:.02em;flex:none}
  .panel-head .badge{margin-left:auto;font-size:10px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--line-soft);color:var(--muted);transition:all .3s}
  .panel-head .badge.on{background:var(--a-bg);color:var(--a)}
  .panel-head .badge.live{background:var(--r-bg);color:var(--r)}
  .panel-head .badge.live::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--r);margin-right:4px;vertical-align:1px;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  .chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
  .chat::-webkit-scrollbar{width:6px}
  .chat::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

  .msg{display:flex;gap:9px;font-size:12.5px;line-height:1.7;animation:msgIn .38s cubic-bezier(.16,1,.3,1) both}
  @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .msg .avatar{width:24px;height:24px;border-radius:7px;flex:none;display:grid;place-items:center;font-size:11px}
  .msg.user .avatar{background:#e0f2fe;color:var(--brand)}
  .msg.bot .avatar{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff}
  .msg .bubble{background:var(--line-soft);border-radius:10px;padding:8px 12px;color:var(--text-2);max-width:calc(100% - 34px)}
  .msg.user .bubble{background:#f0f9ff;border:1px solid #e0f2fe;font-weight:600;color:var(--brand)}
  .msg.bot .bubble{background:#fff;border:1px solid var(--line)}
  .msg.bot .bubble b{color:var(--text);font-weight:700}
  .msg.bot .bubble .mini{font-size:11px;color:var(--muted);margin-top:5px;font-family:var(--mono);line-height:1.55}

  .typing{display:inline-flex;gap:3px;align-items:center;height:16px}
  .typing i{width:5px;height:5px;border-radius:50%;background:var(--muted-2);animation:bounce 1.4s infinite}
  .typing i:nth-child(2){animation-delay:.2s}
  .typing i:nth-child(3){animation-delay:.4s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}

  .composer{flex:none;border-top:1px solid var(--line);padding:12px 14px;background:linear-gradient(180deg,#fbfdff,#fff)}
  .composer-hint{font-size:11px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .composer-hint::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 3px rgba(2,132,199,.14);flex:none;animation:pulse 1.8s ease-in-out infinite}
  .opts{display:flex;flex-direction:column;gap:7px}
  .opt{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 12px;font-size:12.5px;color:var(--text-2);cursor:pointer;font-family:inherit;transition:all .16s cubic-bezier(.16,1,.3,1);animation:optIn .4s both}
  @keyframes optIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .opt:hover{border-color:var(--brand);background:#f0f9ff;transform:translateX(3px)}
  .opt .oicon{font-size:14px;flex:none;width:18px;text-align:center}
  .opt .olabel{flex:1;font-weight:600}
  .opt .otag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--line-soft);color:var(--muted);flex:none}
  .opt:hover .otag{background:rgba(2,132,199,.12);color:var(--brand)}

  .start-btn{width:100%;border:none;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-family:inherit;font-size:13px;font-weight:700;padding:12px;cursor:pointer;box-shadow:0 8px 20px -8px rgba(2,132,199,.6);transition:all .18s}
  .start-btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px -8px rgba(2,132,199,.7)}

  /* 需求档案 */
  .needs-panel{flex:none;max-height:270px;display:flex;flex-direction:column}
  .needs-list{overflow-y:auto;padding:6px 0}
  .need-item{display:flex;align-items:center;gap:9px;padding:8px 14px;transition:background .5s}
  .need-item .ni{width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:13px;background:var(--line-soft);color:var(--muted-2);transition:all .4s}
  .need-item.filled .ni{background:#e0f2fe;color:var(--brand)}
  .need-item .nb{flex:1;min-width:0}
  .need-item .nl{font-size:10px;color:var(--muted-2)}
  .need-item.filled .nl{color:var(--muted)}
  .need-item .nv{font-size:12px;font-weight:700;color:var(--muted-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .4s}
  .need-item.filled .nv{color:var(--text)}
  .need-item .nc{width:14px;height:14px;border-radius:50%;flex:none;background:var(--a-bg);color:var(--a);display:grid;place-items:center;font-size:8px;font-weight:900;opacity:0;transform:scale(.5);transition:all .4s cubic-bezier(.16,1,.3,1)}
  .need-item.filled .nc{opacity:1;transform:scale(1)}
  .need-item.flash{animation:flashIn 1.2s cubic-bezier(.16,1,.3,1)}
  @keyframes flashIn{0%{background:#dcfce7;box-shadow:inset 3px 0 0 var(--a)}100%{background:transparent;box-shadow:none}}

  /* 右栏 */
  .right-col{display:flex;flex-direction:column;gap:14px;min-width:0}

  /* 阶段条 */
  .phase-bar{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 8px;box-shadow:var(--shadow);overflow-x:auto}
  .ph{display:flex;align-items:center;gap:8px;flex:1;min-width:0;padding:0 10px;opacity:.35;transition:opacity .4s}
  .ph.done,.ph.active{opacity:1}
  .ph .ph-num{width:24px;height:24px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:800;font-family:var(--mono);background:var(--line-soft);color:var(--muted-2);border:1.5px solid var(--line);transition:all .4s}
  .ph.done .ph-num{background:var(--a-bg);color:var(--a);border-color:var(--a)}
  .ph.active .ph-num{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 4px rgba(2,132,199,.16)}
  .ph .ph-txt{font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap;transition:color .4s}
  .ph.done .ph-txt{color:var(--text-2)}
  .ph.active .ph-txt{color:var(--brand)}
  .ph-line{flex:none;width:16px;height:1.5px;background:var(--line);border-radius:2px}
  @media(max-width:760px){.ph .ph-txt{display:none}.ph{justify-content:center}}

  /* Tab */
  .tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px;box-shadow:var(--shadow);overflow-x:auto}
  .tab{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:9px;border:none;background:transparent;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .16s;white-space:nowrap;flex:none;position:relative}
  .tab:hover{background:var(--line-soft);color:var(--text-2)}
  .tab.active{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 6px 16px -6px rgba(2,132,199,.6)}
  .tab .tico{font-size:14px}
  .tab .tbadge{font-size:9px;font-weight:800;font-family:var(--mono);padding:1px 6px;border-radius:99px;background:var(--line-soft);color:var(--muted)}
  .tab.active .tbadge{background:rgba(255,255,255,.25);color:#fff}
  .tab .tbadge.on{background:var(--a-bg);color:var(--a)}
  .tab.active .tbadge.on{background:rgba(255,255,255,.3);color:#fff}
  .tab .alert-dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--r);border:1.5px solid #fff;animation:pulse 1.6s infinite}

  /* Tab内容 */
  .tab-content{min-height:400px}
  .tc{display:none;flex-direction:column;gap:14px;animation:viewIn .4s cubic-bezier(.16,1,.3,1)}
  .tc.active{display:flex}
  @keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* 区块头 */
  .sec-head{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 20px}
  .sec-head h2{font-size:15px;font-weight:700;letter-spacing:-.01em;margin-bottom:6px;display:flex;align-items:center;gap:9px}
  .sec-head h2 .n{font-family:var(--mono);font-size:11px;background:var(--brand);color:#fff;padding:2px 8px;border-radius:6px}
  .sec-head p{font-size:12px;color:var(--muted);line-height:1.75}
  .sec-head p b{color:var(--text-2)}

  /* 卡片 */
  .cards{display:grid;gap:12px}
  .cards.c2{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .cards.c3{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}

  .cd{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:15px 17px;cursor:pointer;position:relative;transition:all .2s cubic-bezier(.16,1,.3,1);animation:cardIn .45s both}
  @keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .cd:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:0 12px 28px -12px rgba(2,132,199,.4)}
  .cd.selected{border-color:var(--a);background:linear-gradient(180deg,#f6fefb,#fff);box-shadow:0 12px 28px -12px rgba(5,150,105,.4)}
  .cd.selected::after{content:"✓";position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--a);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:900;animation:pop .3s cubic-bezier(.16,1,.3,1)}
  .cd.disabled{opacity:.5;cursor:default;pointer-events:none}
  @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}

  .cd-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;padding-right:26px}
  .cd-head h4{font-size:13.5px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0}
  .cd-badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
  .badge-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--line-soft);color:var(--muted);border:1px solid var(--line)}
  .badge-tag.green{background:var(--a-bg);color:var(--a);border-color:#a7f3d0}
  .badge-tag.blue{background:var(--b-bg);color:var(--b);border-color:#bfdbfe}
  .badge-tag.amber{background:var(--c-bg);color:var(--c);border-color:#fde68a}
  .badge-tag.red{background:var(--r-bg);color:var(--r);border-color:#fecaca}
  .cd.selected .badge-tag{background:rgba(5,150,105,.08);color:var(--a);border-color:rgba(5,150,105,.2)}

  .cd-body{font-size:12px;color:var(--text-2);line-height:1.7}
  .cd-body .row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
  .cd-body .row .k{color:var(--muted);flex:none}
  .cd-body .row .v{font-weight:600;color:var(--text)}
  .cd-why{font-size:11.5px;color:var(--muted);line-height:1.65;padding-top:9px;margin-top:9px;border-top:1px dashed var(--line);display:flex;gap:6px}
  .cd-why::before{content:"💡";flex:none;font-size:11px}
  .cd-foot{display:flex;align-items:center;gap:10px;margin-top:9px;font-size:10.5px;color:var(--muted-2);font-family:var(--mono);flex-wrap:wrap}

  /* 体力条 */
  .stamina{display:flex;gap:2px;align-items:center}
  .stamina i{width:10px;height:6px;border-radius:2px;background:var(--line)}
  .stamina i.on{background:var(--a)}
  .stamina.s2 i.on{background:#84cc16}
  .stamina.s3 i.on{background:var(--c)}
  .stamina.s4 i.on{background:var(--r)}

  /* 余票条 */
  .avail{height:5px;background:var(--line-soft);border-radius:99px;overflow:hidden;margin-top:4px}
  .avail i{display:block;height:100%;border-radius:99px}

  /* 天气卡 */
  .weather-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
  .wcard{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:16px;text-align:center;transition:all .3s;position:relative}
  .wcard.alert{border-color:var(--c);background:linear-gradient(180deg,#fffdf5,#fff)}
  .wcard .wd{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:8px}
  .wcard .wi{font-size:30px;line-height:1;margin-bottom:6px}
  .wcard .wt{font-size:15px;font-weight:800;font-family:var(--mono);letter-spacing:-.02em}
  .wcard .ws{font-size:11px;color:var(--muted);margin-top:4px}
  .wcard .wtag{position:absolute;top:8px;right:8px;font-size:9px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--c-bg);color:var(--c)}

  /* 携带清单 */
  .pack-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
  .pack-item{display:flex;align-items:center;gap:9px;padding:10px 13px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:12px;transition:all .2s}
  .pack-item.urgent{border-color:var(--c);background:linear-gradient(180deg,#fffdf5,#fff)}
  .pack-item .pi{font-size:16px;flex:none}
  .pack-item .pt{flex:1;min-width:0}
  .pack-item .pn{font-weight:700;color:var(--text)}
  .pack-item .pr{font-size:10.5px;color:var(--muted);margin-top:1px}

  /* 行程 */
  .itinerary-day{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;animation:cardIn .5s both}
  .id-head{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#fbfdff,#fff)}
  .id-num{font-family:var(--mono);font-size:11px;font-weight:700;background:var(--text);color:#fff;padding:3px 10px;border-radius:6px;letter-spacing:.03em;flex:none}
  .id-head h3{font-size:14px;font-weight:700;letter-spacing:-.01em}
  .id-head .id-sub{font-size:11.5px;color:var(--muted);margin-left:auto;text-align:right;line-height:1.5;white-space:pre-line}
  .id-body{padding:6px 20px 16px}
  .it{display:grid;grid-template-columns:58px 1fr;gap:14px;padding:13px 0;border-bottom:1px dashed var(--line-soft);position:relative}
  .it:last-child{border-bottom:none}
  .it::before{content:"";position:absolute;left:-20px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
  .it.food::before{background:var(--c)}
  .it.trans::before{background:var(--b)}
  .it .t-time{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--brand);padding-top:1px}
  .it .t-time small{display:block;font-size:10px;color:var(--muted-2);font-weight:400;margin-top:1px}
  .it h4{font-size:13.5px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .it .t-desc{font-size:12px;color:var(--text-2);margin-top:4px;line-height:1.7}
  .it .t-meta{font-size:11px;color:var(--muted);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap;font-family:var(--mono)}
  .it .t-tip{font-size:11.5px;color:var(--muted);margin-top:6px;background:var(--line-soft);border-radius:7px;padding:7px 10px;border-left:2px solid #cbd5e1;display:flex;gap:6px}
  .it .t-tip::before{content:"💡";flex:none}

  /* 实时修正 */
  .alert-card{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:16px 18px;animation:cardIn .5s both;position:relative}
  .alert-card.high{border-color:var(--r);background:linear-gradient(180deg,#fffafa,#fff);box-shadow:0 8px 24px -10px rgba(220,38,38,.25)}
  .alert-card.mid{border-color:var(--c);background:linear-gradient(180deg,#fffdf5,#fff)}
  .alert-card.low{border-color:var(--b);background:linear-gradient(180deg,#f8fbff,#fff)}
  .ac-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:9px}
  .ac-icon{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:16px}
  .ac-icon.high{background:var(--r-bg);color:var(--r)}
  .ac-icon.mid{background:var(--c-bg);color:var(--c)}
  .ac-icon.low{background:var(--b-bg);color:var(--b)}
  .ac-head h4{font-size:13.5px;font-weight:700;flex:1;line-height:1.5}
  .ac-head .time{font-size:10.5px;color:var(--muted-2);font-family:var(--mono);flex:none}
  .ac-body{font-size:12px;color:var(--text-2);line-height:1.75;margin-bottom:10px}
  .ac-body b{color:var(--text)}
  .ac-suggest{background:var(--line-soft);border-radius:9px;padding:11px 13px;font-size:12px;color:var(--text-2);line-height:1.75;border-left:3px solid var(--brand)}
  .ac-suggest .stag{font-size:10.5px;font-weight:700;color:var(--brand);letter-spacing:.03em;margin-bottom:4px}
  .ac-actions{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
  .ac-btn{font-family:inherit;font-size:11.5px;font-weight:700;border-radius:8px;padding:7px 14px;cursor:pointer;transition:all .16s;border:1px solid transparent}

  /* ---------- 修正 ---------- */
  function renderAlerts(){
    if (state.stage < 3){
      tabContentEl.innerHTML = '<div class="tc active"><div class="empty"><div class="ei">🚨</div><h3>实时护航还没启动</h3><p>行程生成后，我会持续盯着天气、余票、景点状态。<br>有变化会第一时间告诉你，并给出调整建议。</p></div></div>';
      return;
    }

    var html = '<div class="tc active">';
    html += '<div class="sec-head"><h2>🚨 实时修正 <span class="n">' + DATA.events.length + ' 条</span></h2>' +
      '<p>这些是出行前后可能发生的变化。<b>每条我都给了应对建议，你确认后我会直接改到行程里</b>。</p></div>';

    DATA.events.forEach(function(ev){
      var accepted = state.alertsAccepted.indexOf(ev.id) > -1;
      var dismissed = state.alertsDismissed.indexOf(ev.id) > -1;
      html += '<div class="alert-card ' + ev.level + '">' +
        '<div class="ac-head">' +
          '<span class="ac-icon ' + ev.level + '">' + ev.icon + '</span>' +
          '<h4>' + ev.title + '</h4>' +
          '<span class="time">' + ev.time + '</span>' +
        '</div>' +
        '<div class="ac-body">' + ev.body + '</div>' +
        '<div class="ac-suggest">' +
          '<div class="stag">我的建议</div>' +
          ev.suggest +
        '</div>' +
        '<div class="ac-actions">' +
          (accepted
            ? '<button class="ac-btn" disabled>✓ 已处理</button>'
            : (dismissed
              ? '<button class="ac-btn" disabled>已忽略</button>'
              : '<button class="ac-btn primary" data-accept="' + ev.id + '">' + ev.action + '</button>' +
                '<button class="ac-btn ghost" data-dismiss="' + ev.id + '">先不用</button>'
            )
          ) +
        '</div>' +
      '</div>';
    });

    html += '</div>';
    tabContentEl.innerHTML = html;

    tabContentEl.querySelectorAll('[data-accept]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.dataset.accept;
        if (state.alertsAccepted.indexOf(id) === -1) state.alertsAccepted.push(id);
        toast('已应用调整，行程已更新');
        applyAlert(id);
        renderAlerts();
        renderOverview();
        // 顶部红点
        updateAlertDot();
      });
    });
    tabContentEl.querySelectorAll('[data-dismiss]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.dataset.dismiss;
        if (state.alertsDismissed.indexOf(id) === -1) state.alertsDismissed.push(id);
        renderAlerts();
        updateAlertDot();
      });
    });

    var pending = DATA.events.filter(function(e){
      return state.alertsAccepted.indexOf(e.id) === -1 && state.alertsDismissed.indexOf(e.id) === -1;
    }).length;
    $('tbAlerts').textContent = pending ? pending + ' 条' : '全部处理';
    $('tbAlerts').classList.toggle('on', pending === 0);
    updateAlertDot();
  }

  function updateAlertDot(){
    var alertsTab = document.querySelector('[data-tab="alerts"]');
    var pending = DATA.events.filter(function(e){
      return state.alertsAccepted.indexOf(e.id) === -1 && state.alertsDismissed.indexOf(e.id) === -1;
    }).length;
    var dot = alertsTab.querySelector('.alert-dot');
    if (pending > 0 && !dot){
      var d = document.createElement('span');
      d.className = 'alert-dot';
      alertsTab.appendChild(d);
    } else if (pending === 0 && dot){
      dot.remove();
    }
  }

  /* 应用事件对行程的影响 */
  function applyAlert(id){
    if (!state.itinerary) return;
    if (id === 'e1'){
      // 交换 Day2 和 Day3
      var d2 = state.itinerary[1], d3 = state.itinerary[2];
      state.itinerary[1] = d3; state.itinerary[2] = d2;
      state.itinerary[1].day = 'DAY 2';
      state.itinerary[2].day = 'DAY 3';
    }
    if (id === 'e2'){
      // 改交通
      if (state.transport.out){
        state.transport.out = DATA.transport.options[0];
      }
    }
    if (id === 'e3'){
      // 美食替换
      var idx = state.food.indexOf('fo5');
      if (idx > -1) state.food.splice(idx,1);
      if (state.food.indexOf('fo1') === -1) state.food.push('fo1');
    }
  }

  /* ============================================================
     生成最终行程
     ============================================================ */
  function buildItinerary(){
    // 根据用户的选择，组合 4 天
    var days = [];

    // 选中的景点按区域分
    var selectedSpots = state.spots.map(function(id){
      return DATA.spots.filter(function(s){ return s.id === id; })[0];
    }).filter(Boolean);

    var selectedFoods = state.food.map(function(id){
      return DATA.foods.filter(function(f){ return f.id === id; })[0];
    }).filter(Boolean);

    var outTransport = state.transport.out;
    var retTransport = state.transport.ret;
    var hotel = state.hotel;

    // Day1 老城
    var day1Items = [];
    day1Items.push({
      kind:'trans', time: outTransport ? outTransport.dep : '07:20', dur:'3h48m',
      name: (outTransport ? outTransport.type + ' ' + outTransport.code : '高铁 G1061') + ' · 北京 → 青岛',
      desc: '到青岛站。' + (hotel ? '出站步行 ' + (hotel.walk || '10 分钟') + ' 到「' + hotel.name + '」，先把行李放下。' : '出站后先去酒店放行李。'),
      meta: '🚄 ' + (outTransport ? '¥' + outTransport.price : '¥314') + ' · 二等座'
    });
    var d1spots = selectedSpots.filter(function(s){ return s.area === '老城'; });
    d1spots.forEach(function(s, i){
      day1Items.push({
        time: ['14:00','15:30','16:30'][i] || (16 + i) + ':00',
        dur: s.dur + 'min',
        name: s.name, price: s.price,
        desc: s.desc,
        meta: '📍 ' + s.area + ' · ⏱ ' + s.dur + 'min · 体力 ' + (s.stamina === 1 ? '轻松' : '一般'),
        tip: s.why
      });
    });
    if (selectedFoods[0] && selectedFoods[0].area === '老城'){
      day1Items.push({
        kind:'food', time:'12:30', dur:'1h',
        name: selectedFoods[0].name + ' · 午餐',
        desc: selectedFoods[0].sign + '。' + selectedFoods[0].why,
        meta: '🍜 人均 ¥' + selectedFoods[0].price + ' · ' + selectedFoods[0].dist
      });
    }
    if (day1Items.length > 1){
      days.push({
        day:'DAY 1', title:'抵达青岛 · 老城初印象',
        sub:'10月15日 周四 · 晴 15~21℃\n半天游览 · 步行约 4km',
        items: day1Items
      });
    }

    // Day2 东部
    var day2Items = [];
    var d2spots = selectedSpots.filter(function(s){ return s.area === '东部'; });
    d2spots.forEach(function(s, i){
      day2Items.push({
        time: ['09:00','15:30','19:30'][i] || '14:00',
        dur: s.dur + 'min',
        name: s.name, price: s.price,
        desc: s.desc,
        meta: '📍 ' + s.area + ' · ⏱ ' + s.dur + 'min',
        tip: s.why
      });
    });
    if (selectedFoods[1]){
      day2Items.splice(1, 0, {
        kind:'food', time:'12:30', dur:'1h',
        name: selectedFoods[1].name + ' · 午餐',
        desc: selectedFoods[1].sign,
        meta: '🍜 人均 ¥' + selectedFoods[1].price
      });
    }
    if (day2Items.length){
      days.push({
        day:'DAY 2', title:'海岸线 · 日落与灯火',
        sub:'10月16日 周五 · 多云 14~20℃\n含地铁 · 海边傍晚凉',
        items: day2Items
      });
    }

    // Day3 崂山（或替代）
    var day3Items = [];
    var d3spots = selectedSpots.filter(function(s){ return s.area === '崂山'; });
    if (d3spots.length){
      d3spots.forEach(function(s){
        day3Items.push({
          time:'08:00', dur:'全天',
          name: s.name, price: s.price,
          desc: s.desc,
          meta: '📍 ' + s.area + ' · ⏱ 全天 · 需提前 7 天预约',
          tip: s.why
        });
      });
      // 下雨提醒
      day3Items.push({
        kind:'food', time:'12:30', dur:'1.5h',
        name:'青山渔村 · 渔家乐',
        desc:'红瓦民居错落，蓝海衬着彩色屋舍。渔家乐数量多，以现场为准。',
        meta:'🍽 人均 ¥80 · 无可靠数据，建议现场挑'
      });
    } else {
      // 没选崂山，改为市北或自由
      var d3other = selectedSpots.filter(function(s){ return s.area === '市北'; });
      if (!d3other.length){
        d3other = selectedSpots.filter(function(s){ return s.area === '老城' && s.id !== 's1' && s.id !== 's2'; });
      }
      d3other.forEach(function(s){
        day3Items.push({
          time:'09:30', dur: s.dur + 'min',
          name: s.name, price: s.price,
          desc: s.desc,
          meta: '📍 ' + s.area + ' · ⏱ ' + s.dur + 'min',
          tip: s.why
        });
      });
    }
    if (day3Items.length){
      days.push({
        day:'DAY 3', title: d3spots.length ? '崂山揽秋 · 山海寻仙' : '市区慢行 · 市内漫步',
        sub: d3spots.length ? '10月17日 周六 · 晴转中雨\n车程 55min · 雨天建议改期' : '10月17日 周六 · 多云\n步行 3km · 室内为主',
        items: day3Items
      });
    }

    // Day4 市北 + 返程
    var day4Items = [];
    var d4spots = selectedSpots.filter(function(s){ return s.area === '市北'; });
    d4spots.forEach(function(s, i){
      day4Items.push({
        time: ['09:00','11:00','14:00'][i] || '10:00',
        dur: s.dur + 'min',
        name: s.name, price: s.price,
        desc: s.desc,
        meta: '📍 ' + s.area + ' · ⏱ ' + s.dur + 'min',
        tip: s.why
      });
    });
    if (retTransport){
      day4Items.push({
        kind:'trans', time: retTransport.dep, dur:'3h48m',
        name: retTransport.type + ' ' + retTransport.code + ' · 青岛 → 北京',
        desc: '返程。建议提前 1 小时到站。',
        meta: '🚄 ¥' + retTransport.price + ' · 二等座'
      });
    }
    if (day4Items.length){
      days.push({
        day:'DAY 4', title:'市井饕味 · 返程',
        sub:'10月18日 周日 · 多云 15~22℃\n轻松 · 有返程',
        items: day4Items
      });
    }

    return days;
  }

  /* ============================================================
     主流程
     ============================================================ */
  async function runFlow(){
    /* ---------- 阶段 1：聊需求 ---------- */
    setPhase(1);

    await agentSay('你好，我是旅策。<br><br>把当朋友就行——你告诉我大概情况，<b>交通、住宿、天气、美食、景区我一个个查给你看</b>，最后一起把行程串起来。', 800);
    await agentSay('先从最基础的开始 👇', 600);

    // Q1
    await agentSay('这次是带父母去青岛，对吧？确认一下同行人。', 850);
    var c1 = await showOptions([
      {v:'parents', label:'带爸妈两个人', icon:'👨‍👩', tag:'2 位长辈'},
      {v:'parents_kid', label:'父母 + 一个小孩', icon:'👨‍👩‍👦'},
      {v:'alone', label:'就我自己', icon:'🧍'}
    ], '第 1 / 6 步');
    clearComposer();
    addMessage('user', c1.label);
    var map1 = {parents:'父母 2 人 + 你', parents_kid:'父母 + 小孩 + 你', alone:'独自出行'};
    fillNeed('party', map1[c1.v]);
    await agentSay(c1.v === 'alone' ? '好，一个人。那我按轻松自由行的节奏来排。' : '好，' + (c1.v === 'parents_kid' ? '三代同行，我会把每天路程缩短，多留休息点。' : '那我下一个问题很关键——'), 800);

    // Q2
    await agentSay('父母体力怎么样？膝盖、腰这些有没有要注意的？这直接决定我怎么排路线。', 850);
    var c2 = await showOptions([
      {v:'weak', label:'膝盖不太好，尽量少爬坡', icon:'🦵', tag:'推荐'},
      {v:'ok', label:'身体硬朗，能走能爬', icon:'💪'},
      {v:'normal', label:'一般，正常安排就行', icon:'🚶'}
    ], '第 2 / 6 步');
    clearComposer();
    addMessage('user', c2.label);

    fillNeed('pace', map2[c2.v]);
    if (c2.v === 'weak') await agentSay('明白，膝盖是重点。我会避开台阶密集的点，崂山走仰口缓坡线，每天步行控制在 6 公里内，中间多安排能坐的地方。', 850);
    else await agentSay('好，那选择面就宽了。', 700);

    // Q3
    await agentSay('打算玩几天？', 800);
    var c3 = await showOptions([
      {v:'3', label:'3 天', icon:'📅'},
      {v:'4', label:'4 天', icon:'📅', tag:'常见'},
      {v:'5', label:'5 天以上', icon:'📅'}
    ], '第 3 / 6 步');
    clearComposer();
    addMessage('user', c3.label);
    fillNeed('days', c3.label);
    await agentSay('好，' + c3.label + '。青岛的经典路线差不多刚好。', 700);

    // Q4
    await agentSay('预算大概多少？含住宿和不含，你说个范围就行。', 850);
    var c4 = await showOptions([
      {v:'4000', label:'¥4,000 左右', icon:'💰'},
      {v:'5000', label:'¥5,000 左右', icon:'💰', tag:'常见'},
      {v:'7000', label:'¥7,000 以上', icon:'💰'},
      {v:'auto', label:'你按我的选择估一个', icon:'🤖'}
    ], '第 4 / 6 步');
    clearComposer();
    addMessage('user', c4.label);
    var map4 = {'4000':'¥4,000 左右', '5000':'¥5,000 左右', '7000':'¥7,000 以上', 'auto':'由 Agent 估算'};
    fillNeed('budget', map4[c4.v]);
    await agentSay('好。', 650);

    // Q5
    await agentSay('从哪儿出发？', 800);
    var c5 = await showOptions([
      {v:'bj', label:'北京', icon:'🚄', tag:'高铁 3.5h'},
      {v:'sh', label:'上海', icon:'🚄', tag:'高铁 5h'},
      {v:'other', label:'其他城市', icon:'✈️'}
    ], '第 5 / 6 步');
    clearComposer();
    addMessage('user', c5.label);
    var map5 = {bj:'北京', sh:'上海', other:'其他城市'};
    fillNeed('depart', map5[c5.v]);
    await agentSay('好，' + map5[c5.v] + '出发，我按这个查车次。', 700);

    // Q6
    await agentSay('最后一个——父母饮食上有什么忌口或偏好吗？', 850);
    var c6 = await showOptions([
      {v:'normal', label:'没什么特别，正常吃', icon:'🍽'},
      {v:'light', label:'口味清淡，少油少辣', icon:'🥗'},
      {v:'seafood_yes', label:'爱吃海鲜，想多吃', icon:'🦐', tag:'开海季'},
      {v:'seafood_no', label:'海鲜过敏 / 不吃', icon:'🚫'}
    ], '第 6 / 6 步');
    clearComposer();
    addMessage('user', c6.label);
    var map6 = {normal:'无特别偏好', light:'清淡 · 少油少辣', seafood_yes:'爱吃海鲜', seafood_no:'海鲜过敏'};
    fillNeed('taste', map6[c6.v]);
    await agentSay('好，需求都清楚了。', 700);
    await agentSay('接下来我去查数据——<b>交通、住宿、天气、美食、景区一起捞</b>。右边会一条条亮起来。', 900);

    /* ---------- 阶段 2：查数据 ---------- */
    setPhase(2);
    switchTab('transport');

    // 依次点亮各 Tab
    await sleep(400);
    $('tbTransport').textContent = '已查';
    $('tbTransport').classList.add('on');
    await agentSay('交通查好了。高铁 3 小时 48 分，青岛站就在老城区，出站走 10 分钟就到栈桥——<b>比坐飞机还方便</b>。', 900);

    await sleep(300);
    $('tbHotel').textContent = '已查';
    $('tbHotel').classList.add('on');
    await agentSay('住宿也筛完了。<b>酒店、青旅、公寓都有</b>，我按你说的"离景点近"优先排的。你待会儿自己挑。', 900);

    await sleep(300);
    $('tbWeather').textContent = '已查';
    $('tbWeather').classList.add('on');
    await agentSay('⚠️ 天气有个情况——<b>10/17 崂山那边预报中雨</b>，山上路滑，带父母去不太合适。这个我会在后面的修正里给方案。', 1000);

    await sleep(300);
    $('tbFood').textContent = '已查';
    $('tbFood').classList.add('on');
    await agentSay('美食也捞完了。十月开海季，<b>营口路市场代加工</b>值得去一次，两人 ¥150 能摆一桌。', 900);

    await sleep(300);
    $('tbSpots').textContent = '已查';
    $('tbSpots').classList.add('on');
    await agentSay('景区候选都在右边了。每个都标了 <b>票价、体力等级、建议时长</b>——注意看体力条，<b>三格以上的带父母要慎重</b>。', 950);

    await agentSay('现在你可以去各个 Tab 里挑。<b>交通选去程/返程，住宿选一家，美食和景区任意挑</b>。挑好了我就把行程串起来。', 1000);

    /* ---------- 阶段 2.5：等待用户挑选 ---------- */
    // 提供快捷按钮
    composerEl.innerHTML = '<div class="composer-hint">挑好了就告诉我</div>' +
      '<button class="opt" id="quickPick" style="justify-content:center"><span class="oicon">✨</span><span class="olabel">按推荐帮我全选，直接看行程</span></button>';

    await new Promise(function(resolve){
      document.getElementById('quickPick').addEventListener('click', function(){
        resolve();
      });
    });
    clearComposer();

    // 自动填充推荐
    if (!state.transport.out) state.transport.out = DATA.transport.options[0];
    if (!state.transport.ret) state.transport.ret = DATA.transport.returnOptions[0];
    if (!state.hotel) state.hotel = DATA.hotels[0];
    if (!state.food.length) state.food = ['fo1','fo4','fo6'];
    if (!state.spots.length) state.spots = ['s1','s2','s3','s4','s5','s6','s9','s8'];

    $('tbTransport').textContent = state.transport.out.code;
    $('tbHotel').textContent = '¥' + state.hotel.price;
    $('tbFood').textContent = state.food.length + ' 家';
    $('tbSpots').textContent = state.spots.length + ' 个';

    addMessage('user', '按推荐帮我全选，直接看行程');
    await agentSay('好，我按你的情况挑了：<b>高铁去返、亚朵酒店、春和楼+营口路市场+啤酒博物馆、8 个景区</b>。有想换的随时说。', 950);
    await agentSay('我把它们串起来——', 700);

    /* ---------- 阶段 3：定行程 ---------- */
    setPhase(3);
    state.itinerary = buildItinerary();
    switchTab('itinerary');
    renderItinerary();

    await agentSay('行程出来了。每天几点出发、去哪、吃什么、注意什么，都在里面。', 900);
    await agentSay('另外——<b>10/17 崂山有雨那个事，我在「修正」里给了调整方案</b>。去看看吧。', 900);

    $('tbItin').textContent = state.itinerary.length + ' 天';
    $('tbItin').classList.add('on');
    updateAlertDot();

    /* ---------- 阶段 4：实时护航 ---------- */
    setPhase(4);
    $('tbAlerts').textContent = DATA.events.length + ' 条';

    await agentSay('现在就进入护航阶段了。<b>天气、余票、景点状态，我持续盯着</b>。有变化第一时间告诉你，每条都带应对建议——你点头我就改。', 1000);

    // 自动切到修正 Tab 提示
    setTimeout(function(){
      if (currentTab !== 'alerts'){
        switchTab('alerts');
      }
    }, 1200);
  }

  /* ============================================================
     启动
     ============================================================ */
  function init(){
    chatEl.innerHTML = '';
    composerEl.innerHTML = '<div class="composer-hint">准备好了就开始</div>' +
      '<button class="start-btn" id="startBtn">开始规划 →</button>';
    renderNeeds();
    renderOverview();
    setPhase(1);
    $('startBtn').addEventListener('click', function(){
      chatEl.innerHTML = '';
      composerEl.innerHTML = '';
      runFlow();
    });
    $('resetBtn').addEventListener('click', function(){ location.reload(); });
  }

  init();
})();
</script>

</body>
</html>
