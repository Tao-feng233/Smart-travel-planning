const tabs=[['destination','map','目的地'],['transport','plane','往返交通'],['hotel','bed','住宿'],['spot','pin','想去的地方'],['food','food','吃什么'],['plan','calendar','我的行程']];
function renderWorkspace(){const s=state.selections,e=estimate(),h=currentHotel(),t=catalog().transport.find(x=>x.id===s.transport);const progress=[['时间与交通',!!state.date&&(!!s.transport||s.selfTransport)],['住在哪里',!!s.hotel||s.selfHotel],['想去哪里',!!s.spots.length],['行程草稿',state.plan]];$('#app').innerHTML=`<div class="workspace ${mobileChat?'show-chat':''}">${renderChat()}<section class="work-main"><div class="between"><div><div class="eyebrow">LET'S MAKE IT YOURS</div><h1 class="trip-title" style="margin-top:5px">${state.city?esc(state.city)+'，'+(state.pace==='亲子'?'一起长大的旅行':state.pace==='轻松'?'慢慢走':'自在去发现'):'下一站，一起找方向'}</h1><div class="trip-meta"><span>${esc(state.origin)}出发</span><span>${state.days}天${state.days-1}晚</span><span>${partyLabel()}</span><span>${state.plan?'行程版本 '+state.version:'正在一起规划'}</span></div></div><div class="trip-controls"><button class="btn secondary small" data-action="undo" ${undoStack.length?'':'disabled'}>${ico('undo')}撤销</button><button class="btn soft small" data-action="export">${ico('book')}保存路书</button></div></div><div class="profile"><button data-action="dates">${ico('calendar')}${dateLabel()}${ico('edit')}</button><button data-action="preferences">${ico('wallet')}${state.budget?'总预算 ¥'+state.budget:'预算待商量'}</button><button data-action="preferences">${ico('people')}${state.pace==='轻松'?'少走路 · 多休息':state.pace==='亲子'?'亲子节奏 · 留午休':'适中节奏'}</button><button data-action="preferences">${ico('heart')}${esc(state.interests.join(' · '))}</button></div><div class="journey">${progress.map((x,i)=>`<div class="journey-step ${x[1]?'done':i===progress.findIndex(y=>!y[1])?'current':''}"><span class="step-number">${x[1]?'✓':i+1}</span>${x[0]}</div>`).join('')}<span class="tiny muted" style="margin-left:auto">可以随时跳转</span></div><div class="summary-strip"><span class="muted tiny">已经决定</span>${s.selfTransport?`<span class="selection-chip">${ico('plane')}交通已订<button data-action="clear" data-id="selfTransport" aria-label="移除已有交通">×</button></span>`:t?`<span class="selection-chip">${t.type}<button data-action="clear" data-id="transport" aria-label="移除交通">×</button></span>`:''}${s.selfHotel?`<span class="selection-chip">${ico('bed')}住宿已订<button data-action="clear" data-id="selfHotel" aria-label="移除已有住宿">×</button></span>`:h?`<span class="selection-chip">${esc(h.name.split(' · ')[0])}${s.room?' · '+(s.room==='breakfast'?'含早':'标准房'):''}<button data-action="clear" data-id="hotel" aria-label="移除酒店">×</button></span>`:''}${s.spots.length?`<span class="selection-chip">${ico('pin')}${s.spots.length}个想去的地方</span>`:''}${!t&&!h&&!s.selfTransport&&!s.spots.length?`<span class="muted tiny">不必一次选完，从最想确定的部分开始。</span>`:''}<button class="text-btn" data-action="basket">查看全部</button></div><nav class="tabs">${tabs.map(x=>`<button class="tab ${state.tab===x[0]?'active':''}" data-action="tab" data-id="${x[0]}">${ico(x[1])}${x[2]}${x[0]==='spot'&&s.spots.length?`<span class="count">${s.spots.length}</span>`:''}</button>`).join('')}</nav><div class="tab-content" id="tab-content">${renderTab()}</div><div class="footer-disclaimer">全部内容为模拟展示 · 所有选择仅保存在此浏览器，不产生预订或付款</div></section><button class="mobile-chat-toggle" data-action="toggle-chat">${ico('spark')}${mobileChat?'返回旅行工作区':'和识途聊聊'}</button></div>`;const sc=$('#chat-scroll');if(sc)sc.scrollTop=sc.scrollHeight;}

function head(title,desc,extra=''){return`<div class="content-head between"><div><h2>${title}</h2><p>${desc}</p></div>${extra}</div>`;}

function renderTransport(){const s=state.selections;return head('先把出发和回来的时间留好','比较票价，也看看路上时间和接驳。选择后，第一天与最后一天会随之调整。',`<button class="text-btn" data-action="booked-form" data-id="transport">我已经订好了</button>`)+(s.selfTransport?`<div class="notice green"><span>✓ 已保留你的交通：${esc(state.bookedTransport)}。规划会考虑到达和返程时间。</span><button class="text-btn" data-action="booked-form" data-id="transport">修改</button></div>`:'')+(!state.date?`<div class="notice"><span>以下为出行方式示例。确定日期后，才能确认当天的班次与报价。</span><button class="btn small secondary" data-action="dates">确定日期</button></div>`:'')+`<div class="filter-row">${['综合推荐','省一点','少花时间'].map(x=>`<button class="filter ${state.filter===x?'active':''}" data-action="filter" data-id="${x}">${x}</button>`).join('')}</div><div class="cards">${sortItems(catalog().transport).map((x,i)=>`<article class="card transport ${s.transport===x.id?'selected':''}"><div class="between"><div class="flex">${ico(x.kind==='flight'?'plane':'calendar')}<h3 style="font-size:14px">${x.name}</h3></div>${i===0?'<span class="pill">先看看</span>':''}</div><div class="transport-line"><div><div class="station-time">${x.depart}</div><div class="station-name">${esc(state.origin)}${x.kind==='flight'?'机场':'站'}</div></div><div class="travel-line">${x.duration}<div class="arrow"></div>${x.number}</div><div><div class="station-time">${x.arrive}</div><div class="station-name">${x.station}</div></div></div><div class="transport-detail">${x.tags.map(t=>`<span class="pill gray">${t}</span>`).join('')}<span class="pill ${x.id==='t2'?'amber':''}">${x.id==='t2'?'注意路上时间':'可售状态示例'}</span></div><div class="reason">${ico('spark')}<span>${x.id==='t0'?'到站接驳较方便。适合把舒适度和时间一起考虑。':x.id==='t1'?'到达更早，但机场接驳、值机和税费也要一起比较。':'票价更低，不过会占用更多游玩时间。可以看看这份取舍是否值得。'}</span></div><div class="card-foot"><div><div class="price"><em>¥</em>${x.price}<small> / 人 · 单程示例</small></div><div class="source-line">交通报价与班次均为模拟</div></div><div class="card-actions"><button class="btn secondary" data-action="detail" data-id="${x.id}">详情</button><button class="btn ${s.transport===x.id?'soft':''}" data-action="select-transport" data-id="${x.id}">${s.transport===x.id?'已选择':'选这个'}</button></div></div></article>`).join('')}</div>`+bottom('回程也会一并留出时间','选择的是往返出行方案，返回时段可在详情中调整。','接着看住宿','tab','hotel');}
function sortItems(items){let a=[...items];if(state.filter==='省一点'||state.filter==='价格优先')a.sort((x,y)=>x.price-y.price);if(state.filter==='少花时间')a.sort((x,y)=>x.id==='t1'?-1:y.id==='t1'?1:0);return a;}
function renderHotels(){const s=state.selections;return head('住得舒服，也住在合适的位置','先比较酒店，再选择房型。不必只看最低价，位置、休息质量和退改也很重要。',`<button class="text-btn" data-action="booked-form" data-id="hotel">我已经订好了</button>`)+(s.selfHotel?`<div class="notice green"><span>✓ 已保留你的住宿：${esc(state.bookedHotel)}。不会替你更换。</span><button class="text-btn" data-action="booked-form" data-id="hotel">修改</button></div>`:'')+`<div class="filter-row">${['综合推荐','价格优先','位置方便','安静休息'].map(x=>`<button class="filter ${state.filter===x?'active':''}" data-action="filter" data-id="${x}">${x}</button>`).join('')}<button class="text-btn" data-action="area-guide">住哪个区域？ →</button></div><div class="cards">${sortItems(catalog().hotels).map((x,i)=>`<article class="card ${s.hotel===x.id?'selected':''}"><div class="card-art">${art(x.kind,i+11)}<span class="art-badge">${x.area}</span><button class="art-save" data-action="favorite" data-id="${x.id}" aria-label="收藏${esc(x.name)}">${state.favorites.includes(x.id)?'♥':'♡'}</button></div><div class="card-body"><div class="between"><h3>${x.name}</h3><span class="rating">★ ${x.rating}</span></div><p class="card-description">${x.desc}</p><div class="tags">${x.tags.map(t=>`<span class="pill">${t}</span>`).join('')}<span class="pill gray">${Math.ceil((state.adults+state.kids)/2)}间 · ${state.days-1}晚</span></div><div class="reason">${ico('spark')}<span>${state.budget&&state.budget<2000?x.id==='h2'?'住宿费用更低，可以把预算留给餐饮和体验。':'住得更好，但会压缩其他部分的预算。':state.pace==='轻松'?x.id==='h0'?'附近散步与休息方便，适合父母不赶路的节奏。':'可以比较接驳时间，再判断价格上的节省是否值得。':x.id==='h1'?'价格和位置比较均衡，可以先展开看看房型。':'适合对应偏好，也需要看看房型和具体规则。'}</span></div><div class="card-foot"><div><div class="price"><em>¥</em>${x.price}<small> / 间晚起</small></div><div class="source-line">酒店候选 · 起价示例</div></div><button class="btn ${s.hotel===x.id?'soft':''}" data-action="detail" data-id="${x.id}">${s.hotel===x.id?'查看已选房型':'看房型与取舍'}</button></div></div></article>`).join('')}</div>`+bottom('想先挑景点也可以','住宿可以暂定，后面再根据路线比较位置。','看看想去的地方','tab','spot');}
function renderSpots(){let spots=catalog().spots;if(state.filter==='室内备选')spots=spots.filter(x=>x.indoor==='室内');if(state.filter==='少走路')spots=spots.filter(x=>x.energy==='低');if(state.filter==='免费开放')spots=spots.filter(x=>!x.price);if(state.filter==='亲子兴趣')spots=spots.filter(x=>x.id==='s4'||x.id==='s5'||x.id==='s3');return head('喜欢的地方，先放进旅行里','不用一次选完。可以收藏、加入想去，再一起安排顺序和留白。',`<button class="text-btn" data-action="recommend">帮我挑一组</button>`)+`<div class="filter-row">${['全部','少走路','室内备选','免费开放','亲子兴趣'].map(x=>`<button class="filter ${state.filter===x?'active':''}" data-action="filter" data-id="${x}">${x}</button>`).join('')}</div><div class="cards">${spots.map((x,i)=>`<article class="card ${state.selections.spots.includes(x.id)?'selected':''}"><div class="card-art">${art(x.kind,i+21)}<span class="art-badge">${x.indoor} · 体力${x.energy}</span><button class="art-save" data-action="favorite" data-id="${x.id}" aria-label="收藏${esc(x.name)}">${state.favorites.includes(x.id)?'♥':'♡'}</button></div><div class="card-body"><div class="between"><h3>${x.name}</h3><span class="rating">★ ${x.rating}</span></div><p class="card-description">${x.desc}</p><div class="tags"><span class="pill">${x.tag}</span>${x.energy==='高'&&state.pace==='轻松'?'<span class="pill amber">与你的轻松节奏有冲突</span>':x.id==='s4'&&state.kids?'<span class="pill">孩子可能会喜欢</span>':'<span class="pill gray">游玩时长可调整</span>'}</div><div class="reason">${ico('spark')}<span>${x.energy==='高'?'建议留出较完整的时间。如果不想走太多，可以先选择其他地方。':x.indoor==='室内'?'适合安排在雨天或需要放慢节奏的半天。':state.pace==='轻松'?'可以慢慢逛、随时休息，不需要强行走完全部。':'与同一区域的地点搭配，更容易留出悠闲的时间。'}</span></div><div class="card-foot"><div><div class="price">${x.price?'<em>¥</em>'+x.price+'<small> / 人起</small>':'免费开放'}</div><div class="source-line">${x.price?'门票起价':'开放信息'}与游玩建议均为模拟</div></div><div class="card-actions"><button class="btn secondary" data-action="detail" data-id="${x.id}">了解</button><button class="btn ${state.selections.spots.includes(x.id)?'soft':''}" data-action="toggle-spot" data-id="${x.id}">${state.selections.spots.includes(x.id)?'✓ 已加入':'加入想去'}</button></div></div></div></article>`).join('')}</div>`+bottom(state.selections.spots.length?`已经有 ${state.selections.spots.length} 个想去的地方`:'不用填满每个小时','生成后仍可以替换、删减、留出休息。','安排成行程','generate');}
function renderFood(){return head('吃饭也是旅行的一部分','给你几个不同的选择。可以先定一顿，也可以只保留口味和预算，旅行时再决定。')+`<div class="filter-row">${['综合推荐','价格优先','清淡口味','适合孩子'].map(x=>`<button class="filter ${state.filter===x?'active':''}" data-action="filter" data-id="${x}">${x}</button>`).join('')}</div><div class="cards">${sortItems(catalog().food).map((x,i)=>`<article class="card ${state.selections.food===x.id?'selected':''}"><div class="card-art">${art('food',i+31)}<span class="art-badge">${x.tags[0]}</span></div><div class="card-body"><div class="between"><h3>${x.name}</h3><span class="rating">★ ${x.rating}</span></div><p class="card-description">${x.desc}</p><div class="tags">${x.tags.map(t=>`<span class="pill">${t}</span>`).join('')}</div><div class="reason">${ico('spark')}<span>${x.id==='f0'?'同行人可以一起选菜，清淡与特色口味都留有余地。':x.id==='f1'?'费用较低，不用把每顿饭都安排成需要专程前往的目的地。':'适合午后休息；选择时可以一起看看费用是否合适。'}</span></div><div class="card-foot"><div><div class="price"><em>¥</em>${x.price}<small> / 人参考</small></div><div class="source-line">人均与营业信息为模拟 · 非实际订单价</div></div><div class="card-actions"><button class="btn secondary" data-action="detail" data-id="${x.id}">详情</button><button class="btn ${state.selections.food===x.id?'soft':''}" data-action="select-food" data-id="${x.id}">${state.selections.food===x.id?'✓ 已安排':'安排一顿'}</button></div></div></div></article>`).join('')}</div>`+bottom('其他餐次留有弹性','不需要每顿都提前决定，路书会保留参考预算。','查看行程草稿','generate');}
function buildPlan(){const bins=Array.from({length:state.days},()=>[]),capacity=Array.from({length:state.days},(_,i)=>i===0||i===state.days-1?1:2);const t=catalog().transport.find(x=>x.id===state.selections.transport);if(t&&t.arrive>='17:00')capacity[0]=0;let cursor=0;state.unassigned=[];for(const id of state.selections.spots){while(cursor<bins.length&&bins[cursor].length>=capacity[cursor])cursor++;if(cursor<bins.length)bins[cursor].push(id);else state.unassigned.push(id);}state.dayPlans=bins;state.plan=true;state.day=Math.min(state.day||0,state.days-1);state.version++;}
function syncPlan(){const selected=state.selections.spots,transport=catalog().transport.find(x=>x.id===state.selections.transport);const cap=Array.from({length:state.days},(_,i)=>i===0||i===state.days-1?1:2);if(transport&&transport.arrive>='17:00')cap[0]=0;const bins=Array.from({length:state.days},(_,i)=>(state.dayPlans[i]||[]).filter(id=>selected.includes(id)).slice(0,cap[i]));for(const id of selected.filter(id=>!bins.flat().includes(id))){const slot=bins.findIndex((bin,i)=>bin.length<cap[i]);if(slot>=0)bins[slot].push(id);}state.dayPlans=bins;state.unassigned=selected.filter(id=>!bins.flat().includes(id));state.version++;}
function mapView(){const ids=state.dayPlans?.[state.day]||state.selections.spots;const points=[[48,43],[162,72],[99,132],[205,121]];return`<svg class="map-svg" viewBox="0 0 260 175" role="img" aria-label="当天路线示意"><rect width="260" height="175" fill="#eef2e8"/><path d="M220 0q-80 60-25 105t-55 70h120V0" fill="#d7e7e6"/><path d="M0 40h190M0 90h220M30 0l35 175M130 0l-25 175M0 155l220-30" fill="none" stroke="#fffdf6" stroke-width="9"/><path d="M48 43 162 72 99 132" fill="none" stroke="#83a68a" stroke-width="2" stroke-dasharray="5 4"/>${points.slice(0,Math.min(ids.length+1,4)).map((p,i)=>`<g><circle cx="${p[0]}" cy="${p[1]}" r="11" fill="${i?'#4e826a':'#d39967'}"/><text x="${p[0]}" y="${p[1]+4}" text-anchor="middle" font-size="10" font-family="sans-serif" fill="white">${i?i:'住'}</text><text x="${p[0]}" y="${p[1]+25}" text-anchor="middle" font-size="9" fill="#71806d">${i?esc(catalog().spots.find(x=>x.id===ids[i-1])?.name.slice(0,6)||'弹性安排'):'住宿'}</text></g>`).join('')}</svg><p class="map-caption">路线示意 · 模拟位置与通行时间</p>`;}
function budgetCard(){const e=estimate(),over=state.budget&&e.total>state.budget;return`<div class="side-card"><div class="between"><h3>这趟旅行，参考花费</h3><button class="text-btn" data-action="budget-detail">明细 ↗</button></div><div class="budget-total">¥${e.total.toLocaleString()} <span class="tiny muted" style="font-weight:400">/${state.adults+state.kids}人合计</span></div><div class="budget-bar ${over?'over':''}"><span style="width:${Math.min(100,state.budget?e.total/state.budget*100:60)}%"></span></div>${['transport','hotel','tickets','food','local'].map((k,i)=>`<div class="budget-line"><span>${['往返交通','住宿','门票起价','餐饮预留','市内交通预留'][i]}</span><span>¥${e[k]}</span></div>`).join('')}<p class="budget-note" style="margin-top:12px">${over?`比总预算多约 ¥${e.total-state.budget}，可以一起调整取舍。`:state.budget?`在总预算 ¥${state.budget} 内，留有约 ¥${state.budget-e.total} 的余地。`:'预算还没定，可以先看看费用分布。'}<br>${e.pending?'包含未确定部分的参考预留。':'包含报价示例、起价和估算预留。'}并非已付款总额。</p>${over?'<button class="btn soft small" style="margin-top:10px;width:100%" data-action="budget-options">看看怎么省一点</button>':''}</div>`;}
function row(time,title,desc,kind='normal',id=''){return`<div class="timeline-item"><div class="timeline-time">${time}</div><div class="timeline-dot"></div><div class="timeline-info"><h4>${esc(title)}</h4><p>${esc(desc)}</p>${kind==='spot'?`<div class="route-note">${ico('map')}通行约 ${id==='s1'?18:12} 分钟 · 路线模拟</div><div class="timeline-buttons"><button class="text-btn" data-action="detail" data-id="${id}">了解这里</button><button class="text-btn" data-action="replace" data-id="${id}">换个地方</button><button class="text-btn" data-action="remove-plan-spot" data-id="${id}">留为空闲</button></div>`:kind==='food'?`<button class="text-btn" data-action="tab" data-id="food">换一家 / 先不决定</button>`:''}</div></div>`;}
function renderDay(index){const spots=(state.dayPlans[index]||[]).map(id=>catalog().spots.find(x=>x.id===id)).filter(Boolean),first=index===0,last=index===state.days-1,t=catalog().transport.find(x=>x.id===state.selections.transport),food=catalog().food.find(x=>x.id===state.selections.food),late=first&&t&&t.arrive>='17:00';let rows='';if(first){rows+=row(t?t.depart:'上午',state.selections.selfTransport?'按已订交通出发':t?t.type+'出发':'出发 · 时间待确定',state.selections.selfTransport?state.bookedTransport:'不用赶景点，先给路上和到达留足时间');rows+=row(t?t.arrive:state.selections.selfTransport?'12:20':'12:00','抵达'+state.city,'接驳到住宿区域；通行和等待留有缓冲');if(!late){rows+=row('13:00','到住宿寄存行李',state.selections.selfHotel?state.bookedHotel:currentHotel()?.name||'住宿待定，先以市区为起点');rows+=row('13:40','先好好吃一顿',food?.name||'到附近找一家合适的小馆，不必急着出发','food');if(spots[0])rows+=row('14:45',spots[0].name,spots[0].desc+' 建议游玩约90分钟。','spot',spots[0].id);else rows+=row('14:45','给自己留一段空白','在附近随走随停，也可以回住处休息');rows+=row('16:45',state.pace==='亲子'?'休息，照顾孩子的节奏':'回酒店休息 / 附近坐坐','这段时间不用填满，累了就提前回来');}else rows+=row('19:30','入住，然后吃晚饭','到达较晚，第一天只安排安顿与休息。');}else{if(spots[0])rows+=row('09:30',spots[0].name,spots[0].desc+' 建议游玩约90分钟。','spot',spots[0].id);else rows+=row('09:30','睡到舒服，再慢慢出门','早餐后决定去哪走走，留白也是计划的一部分');rows+=row('11:15','坐下来休息一会儿',state.pace==='轻松'?'给父母留出休息和洗手间时间。':'咖啡、茶或简单小吃，不必专程赶路');rows+=row('12:00','午饭，吃得舒服一点',food?.name||'附近餐饮待定，保留参考预算','food');if(!last){rows+=row('13:00',state.pace==='亲子'?'午休时间 · 大人也歇一歇':'午后留白 · 自由休息','可以回住处，也可以找个安静地方坐坐');if(spots[1])rows+=row('14:30',spots[1].name,spots[1].desc+' 建议游玩约90分钟。','spot',spots[1].id);else rows+=row('14:30','想再逛逛，或者什么也不做','临时起意也没关系，保留备选就好');rows+=row('16:30','慢下来，看看今天还想做什么','根据体力自由调整，不强行补齐景点');}else{rows+=row('13:15','取行李，为返程做准备','最后一天不安排远距离目的地');rows+=row('14:30','前往车站 / 机场','按所选交通预留接驳、安检与等待时间');rows+=row('16:20','返程，带着这几天的记忆',state.selections.selfTransport?'按你的已订返程安排执行':'返程时段示例，可在交通详情中调整');}}
if(!last&&!late)rows+=row('18:00','晚饭与自由时间','喜欢就多坐一会儿，不再安排必须完成的任务','food');return`<article class="day-card"><div class="day-header between"><div><div class="eyebrow">DAY ${index+1}</div><h3 style="margin-top:5px">${first?'抵达之后，先慢下来':last?'轻轻收尾，从容回家':state.pace==='亲子'?'一起探索，也一起休息':state.rain&&index===1?'换个节奏，雨天也好玩':'喜欢的地方，慢慢去'}</h3><p class="tiny muted" style="margin-top:5px">${spots.length}个安排 · 休息与接驳已留出 · ${state.pace==='轻松'?'轻松节奏':state.pace==='亲子'?'亲子节奏':'弹性节奏'}</p></div><button class="text-btn" data-action="rest-day" data-id="${index}">这天再轻松一点</button></div><div class="timeline">${rows}</div></article>`;}
function renderPlan(){if(!state.plan)return head('把已经选好的，安排成一趟旅行','不需要所有细节都确定。先有一份草稿，再按你的想法慢慢调整。')+`<div class="empty" style="margin-top:20px"><div class="empty-icon">${ico('calendar')}</div><h3>你的行程，正在形成</h3><p>现在有 ${state.selections.spots.length} 个想去的地方。${state.selections.spots.length?'可以先安排顺序和休息，再补齐其他细节。':'可以让识途推荐一组，也可以先生成有留白的草稿。'}</p><div class="flex" style="justify-content:center"><button class="btn" data-action="generate">生成行程草稿</button><button class="btn secondary" data-action="recommend">帮我推荐一组</button></div></div><div style="max-width:340px;margin-top:20px">${budgetCard()}</div>`;
let out=head('这是属于你的旅行','每段安排都可以修改。已经确定的保留下来，没确定的地方留有余地。',`<button class="text-btn" data-action="review">出发前检查 ↗</button>`);if(state.rain&&!state.alertHandled)out+=`<div class="notice"><span><strong>第二天可能下雨</strong><br>户外散步体验会受影响，已找到室内备选。你决定要不要换。</span><div class="flex"><button class="btn secondary small" data-action="rain-preview">看调整建议</button><button class="text-btn" data-action="dismiss-rain">先保留</button></div></div>`;if(state.unassigned?.length)out+=`<div class="notice green"><span>${state.unassigned.length} 个想去的地方留在备选中，避免每天安排过满。</span><button class="text-btn" data-action="basket">看备选</button></div>`;if(!state.date)out+=`<div class="notice"><span>日期还未确定，天气和报价暂作参考。日程顺序可以先讨论。</span><button class="btn secondary small" data-action="dates">确定日期</button></div>`;
if(state.date)out+=`<div class="weather">${Array.from({length:Math.min(state.days,3)},(_,i)=>`<div class="weather-day"><div><strong>第${i+1}天 · ${i===1&&state.rain?'小雨':'晴间多云'}</strong><p class="muted tiny">${i===1&&state.rain?'室内备选更从容':'出门带件薄外套'} · 天气示例</p></div><span class="weather-symbol">${i===1&&state.rain?'☂':'☀'}</span><span>17–23°</span></div>`).join('')}</div>`;
out+=`<div class="day-switch">${Array.from({length:state.days},(_,i)=>`<button class="${state.day===i?'active':''}" data-action="day" data-id="${i}">第 ${i+1} 天${i===0?' · 抵达':i===state.days-1?' · 返程':''}</button>`).join('')}<button data-action="all-days">完整路书 ↗</button></div><div class="plan-layout"><div>${renderDay(state.day)}<div class="recommend-strip"><span>临时累了、下雨，或想换个地方？只调整受影响的部分。</span><button class="text-btn" data-action="change-menu">调整这一段 →</button></div></div><aside class="plan-side"><div class="side-card"><div class="between"><h3>今天怎样走</h3><button class="text-btn" data-action="map-large">展开 ↗</button></div>${mapView()}</div>${budgetCard()}<div class="side-card"><h3>出发前，随手记一下</h3><div class="pack-list">${['证件与预订信息','薄外套与舒服的鞋',state.rain?'雨具与备用衣物':'水杯与防晒',state.kids?'孩子的零食与换洗衣物':'个人常用物品'].map((x,i)=>`<label><input type="checkbox" data-pack="${i}" ${state.packed.includes(i)?'checked':''}>${x}</label>`).join('')}</div><button class="text-btn" style="margin-top:10px" data-action="review">查看完整出发清单 →</button></div></aside></div>`+bottom('这份计划会记住你的选择','可以随时回来继续修改，或保存一份离线路书。','保存路书','export');return out;}
function renderSaved(){const list=storeRead();$('#app').innerHTML=`<div class="home"><div class="eyebrow">YOUR TRAVEL COLLECTION</div><div class="between" style="margin-top:10px"><h1 style="font-size:30px">我的旅行计划</h1><button class="btn" data-action="home">开始新旅行 ${ico('arrow')}</button></div><p class="muted" style="margin-top:10px">每次选择都已保留，可以随时接着聊。</p><div style="margin-top:25px;background:white;border:1px solid var(--line);border-radius:16px;padding:7px 22px">${list.length?list.map(x=>`<div class="saved-row"><div><div class="saved-title">${esc(x.city||'目的地待定')} · ${x.days}天${x.pace==='亲子'?'亲子旅行':x.pace==='轻松'?'轻松旅行':'自在旅行'}</div><p class="tiny muted">${esc(x.origin)}出发 · ${x.adults+x.kids}人 · ${x.plan?'已有行程 · 版本 '+x.version:'正在规划'} · ${x.selections.spots.length}个想去的地方</p></div><button class="btn soft small" data-action="resume" data-id="${esc(x.id)}">继续规划 →</button></div>`).join(''):'<div class="empty" style="border:0"><h3>下一段旅行，从一个想法开始</h3><p>开始规划之后，这里会保留你的选择和行程。</p><button class="btn" data-action="home">开始规划</button></div>'}</div><div class="footer-disclaimer">计划保存在当前浏览器。这里展示的全部旅行数据均为模拟。</div></div>`;}
function modal(title,subtitle,body,wide=false){modalReturn=document.activeElement;$('#modal-root').innerHTML=`<div class="overlay"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><h2 id="modal-title">${title}</h2><p>${subtitle}</p></div><button class="close" data-action="close" aria-label="关闭">×</button></div><div class="modal-body">${body}</div></section></div>`;document.body.style.overflow='hidden';$('.modal .close')?.focus();}
function closeModal(){if(!$('#modal-root'))return;$('#modal-root').innerHTML='';document.body.style.overflow='';if(modalReturn?.isConnected)modalReturn.focus();modalReturn=null;}
const sourceBlock=(type='地点与建议')=>`<div class="detail-section"><h3>这条信息从哪里来？</h3><div class="source-detail">${type}：模拟的工具查询与资料检索结果。<br>价格、开放信息、点评、路线均用于展示，并非真实查询。<br>来源记录：地点/商品查询示例 · 城市旅行资料示例。<br>核对时间：本次规划（模拟）。适用日期：当前计划日期。<br>尚需确认：实际开放日期、当天售价、预约与可售情况。</div></div>`;
function showDetail(id){const cat=catalog();if(id.startsWith('h')){const h=cat.hotels.find(x=>x.id===id),rooms=Math.ceil((state.adults+state.kids)/2),nights=state.days-1;modal(h.name,'先看看房型和取舍，再决定是否加入旅行',`<div class="modal-art">${art('hotel',71)}</div><div class="detail-grid"><div><small>位置</small>${h.area}</div><div><small>评价示例</small>★ ${h.rating} / 5</div><div><small>这次住宿</small>${rooms}间 · ${nights}晚</div></div><div class="detail-section"><h3>为什么推荐 / 哪些地方需要取舍</h3><p>${h.desc}<br>${h.con}</p></div>${!state.date?'<div class="notice">日期待定，可以先暂定酒店，报价与房型后续刷新。</div>':''}<div class="detail-section"><h3>选择房型</h3>${[{key:'standard',name:'舒适双床房',add:0,meal:'不含早餐，可到附近自由选择'},{key:'breakfast',name:'舒适双床房 · 含早餐',add:50,meal:'含双人早餐，早晨更从容'}].map(r=>`<div class="room"><div><strong>${r.name}</strong><p>${r.meal}<br>可售与退改规则示例 · 具体按预订时确认</p></div><div style="text-align:right"><div class="price">¥${h.price+r.add}<small> / 间晚</small></div><p>这次合计示例 ¥${(h.price+r.add)*rooms*nights}</p><button class="btn small" style="margin-top:7px" data-action="choose-room" data-id="${id}:${r.key}">${state.selections.hotel===id&&state.selections.room===r.key?'✓ 已选房型':'选择这个房型'}</button></div></div>`).join('')}</div>${sourceBlock('酒店、房型与报价')}<div class="modal-actions"><button class="btn secondary" data-action="tentative-hotel" data-id="${id}">先暂定酒店，房型稍后选</button></div>`);return;}
if(id.startsWith('t')){const t=cat.transport.find(x=>x.id===id);modal(t.name,'把票价、路上时间与接驳一起比较',`<div class="detail-grid"><div><small>去程示例</small>${t.depart} — ${t.arrive}</div><div><small>回程示例</small>16:20 — 20:30</div><div><small>往返参考</small>¥${t.price*2} / 人</div></div><div class="detail-section"><h3>对行程的影响</h3><p>${t.arrive>='17:00'?'第一天到达较晚，只安排入住和晚饭，景点从第二天开始。':t.id==='t1'?'到达较早，可以多留一点游玩时间；机场接驳与值机也会占用时间。':'第一天到达后可以安顿、吃饭，再安排一个轻松的地方。'}最后一天预留返程接驳和等候。</p></div><div class="detail-section"><h3>需要留意</h3><p>本次展示使用班次和票价示例；实际产品会展开席别/舱位、退改、行李与适用人群规则。选择方案仅加入计划，预订由你确认。</p></div>${sourceBlock('往返交通方案')}<div class="modal-actions"><button class="btn" data-action="select-transport" data-id="${id}">选择这套往返方案</button></div>`);return;}

function startScenario(id,prompt=null){const x=scenarios.find(x=>x.id===id)||scenarios[1];undoStack=[];state={id:'trip-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),scenario:id,origin:'上海',city:x.city,date:x.date,days:x.days,adults:x.adults,kids:x.kids,budget:x.budget,pace:x.pace,interests:x.id==='family'?['海洋动物','午休','不赶路']:x.id==='budget'?['自然','美食','经济舒适']:x.id==='parents'?['看海','清淡','不爬山']:['散步','当地美食'],selections:{transport:null,hotel:null,room:null,spots:[],food:null,selfTransport:false,selfHotel:false},favorites:[],messages:[],tab:x.city?'transport':'destination',filter:'综合推荐',plan:false,version:0,day:0,dayPlans:[],unassigned:[],rain:x.id==='change',alertHandled:false,packed:[],fixedHotel:0,fixedTransport:0,bookedHotel:'',bookedTransport:'',flexible:false};if(prompt){state.adults=2;state.kids=0;state.budget=null;state.pace='适中';state.interests=['自在探索','当地美食'];parseRequest(prompt,true);}say(prompt||x.prompt,[],true);if(id==='booked'){state.selections.selfTransport=true;state.selections.selfHotel=true;state.bookedTransport='已订高铁 · 12:20抵达，第三天16:20返程';state.bookedHotel=state.city+' · 市区已订酒店';state.fixedHotel=900;state.fixedTransport=1200;state.tab='spot';say('好，已经订好的交通和酒店先保留，不需要重新选。我们从想去的地方和吃饭开始，第一天到达和最后一天返程都留好时间。',[opt('帮我推荐一组','recommend'),opt('我自己挑景点','tab','spot'),opt('补充已有预订','booked-form','transport')]);}else if(id==='change'){state.selections.transport='t0';state.selections.hotel='h1';state.selections.room='standard';state.selections.spots=['s0','s1','s5'];state.selections.food='f0';buildPlan();state.day=1;state.tab='plan';say('收到，你正在旅行中，我们只调整第二天受天气影响的部分。交通、酒店和其他天的选择都保留。我找到一个室内备选，先给你看调整前后的变化。',[opt('看雨天调整建议','rain-preview'),opt('今天只想休息','rest-day','1'),opt('先保留原安排','dismiss-rain')]);}else{say(id==='family'?'明白，孩子的兴趣和大人的休息都要照顾。我们不把每天排满，并留出午休。':id==='budget'?'好，我们把钱花在最在意的部分。会一起比较省下的费用和需要接受的取舍。':id==='explore'?'不着急决定目的地。先看三种不同的旅行方向，喜欢哪种生活，再慢慢把细节补起来。':'明白，少赶路、不爬山，多留休息。先把必要条件确认好，选择由你决定。');askNext();}view='workspace';mobileChat=false;persist();render() function askNext(){if(!state.city){state.tab='destination';say('这次更想看海、看看湖山，还是以吃和城市生活为主？你也可以先比较三种方向。',[opt('先比较三个目的地','compare-city'),opt('我想看海 · 青岛','choose-city','青岛'),opt('短途湖山 · 杭州','choose-city','杭州')]);return;}if(!state.date&&!state.flexible){say('大概什么时候出发？日期会影响交通和住宿。还没定好也可以先看玩法。',[opt('10月17日出发','date-choice','2026-10-17'),opt('10月24日出发','date-choice','2026-10-24'),opt('自己选日期','dates'),opt('日期未定，先看玩法','date-flexible')]);return;}if(!state.budget&&!state.budgetSkipped){say('预算有没有大致范围？按所有人这趟旅行的总花费来考虑就好，也可以先看选择再决定。',[opt('总共约3000元','budget-choice','3000'),opt('总共约6000元','budget-choice','6000'),opt('先看选择，再商量','budget-choice','skip')]);return;}say('现在可以开始比较了。你想先确定交通，还是先挑住宿或想去的地方？每一部分都可以暂定、跳过，后面再调整。',[opt('先看往返交通','tab','transport'),opt('先找合适住宿','tab','hotel'),opt('先挑喜欢的地方','tab','spot'),opt('给我一组建议','recommend')]);}
function parseRequest(text,initial=false){let m=text.match(/从([\u4e00-\u9fa5]{2,5})(?:出发|去)/);if(m)state.origin=m[1];const c=cities.find(c=>text.includes(c.name));if(c&&(!state.city||initial))state.city=c.name;const day=text.match(/([二三四五2345])(?:天|日)/);if(day)state.days=({'二':2,'三':3,'四':4,'五':5}[day[1]]||+day[1]);const money=text.match(/(?:预算|总共|合计|总预算)[^\d]{0,4}(\d{3,5})/);if(money)state.budget=+money[1];if(/一千五|1500/.test(text))state.budget=1500;if(/六千/.test(text))state.budget=6000;if(/爸妈|父母|老人/.test(text)){state.pace='轻松';if(initial)state.adults=3;}if(/孩子|亲子|小孩/.test(text)){state.pace='亲子';if(initial)state.kids=1;}if(/一个人|独自|独旅/.test(text)){state.adults=1;state.kids=0;}if(/两个人|两人|两大/.test(text))state.adults=2;if(/不爬山|少走路|不太累|别太累|不要太累/.test(text))state.pace='轻松';const date=text.match(/(2026-\d{2}-\d{2})/);if(date&&!isNaN(new Date(date[1]).getTime()))state.date=date[1];}
function sendText(text){if(!text?.trim())return;text=text.trim().slice(0,1200);commit(()=>{say(text,[],true);const oldBudget=state.budget;parseRequest(text);if(/雨|室内/.test(text)&&/换|改|第二天|今天/.test(text)){state.rain=true;if(!state.plan)buildPlan();state.day=Math.min(1,state.days-1);state.tab='plan';say('我们只看受影响的这一天。先展示一个室内替换方案，其他选择保留。',[opt('看调整前后','rain-preview'),opt('直接多留休息','rest-day',String(state.day))]);}else if(/生成|安排成|路书|行程/.test(text)&&!/酒店|住宿/.test(text)){if(!state.plan)buildPlan();state.tab='plan';say('行程草稿已经展开。想去的地方会按天安排，未确定的部分保留空白；每段都可以替换或留作自由时间。',[opt('看看出发前事项','review'),opt('第二天轻松一点','rest-day','1')]);}else if(/推荐|帮我选|你来选/.test(text)){say('我会保留已经做出的选择，再给一组适合当前节奏的建议。你可以接受，也可以只挑其中一部分。',[opt('看看建议','recommend')]);}else if(/日期|出发时间/.test(text)){say('可以调整日期，想去的地方会保留，相关报价和天气重新确认。',[opt('修改日期','dates')]);}else if(/酒店|住宿|住哪/.test(text)){state.tab='hotel';say('先看住宿。可以比较位置、价格和休息氛围，感兴趣后再看房型与规则。',[opt('介绍住宿区域','area-guide'),opt('查看已有选择','basket')]);}else if(/高铁|飞机|交通|航班/.test(text)){state.tab='transport';say('我们把交通方式、路上时间和费用一起比较。你也可以补充已经订好的信息。',[opt('补充已订交通','booked-form','transport')]);}else if(/吃|餐厅|美食/.test(text)){state.tab='food';say('先看吃什么。可以安排一顿喜欢的，也可以只保留口味和参考预算。',[opt('调整饮食偏好','preferences')]);}else if(/景点|去哪玩|看海|博物馆/.test(text)){state.tab='spot';if(/室内/.test(text))state.filter='室内备选';say('可以先加入几个喜欢的地方，不必一次选完。再一起决定怎么走、留多少休息。',[opt('帮我推荐','recommend')]);}else if(state.budget!==oldBudget){say(`总预算已经更新为 ¥${state.budget}。已有选择保留，参考花费会重新比较。`,[opt('看看费用取舍','budget-options'),opt('查看参考明细','budget-detail')]);}else if(/累|休息|少走|轻松/.test(text)){state.pace='轻松';say('把节奏放慢。你可以选一天减少一个安排，也可以保留景点、多留休息。',[opt('第二天少一个安排','rest-day','1'),opt('看看低体力候选','filter-low')]);}else if(/订好|已订/.test(text)){say('已订的部分可以直接保留。补充交通或住宿信息后，我们安排剩下的内容。',[opt('已有交通','booked-form','transport'),opt('已有住宿','booked-form','hotel')]);}else{say('记下你的想法了。可以继续补充偏好，也可以从当前候选中做选择；如果暂时没想好，我可以先给一组建议。',[opt('补充具体需求','preferences'),opt('给我一组建议','recommend'),opt('看看我的选择','basket')]);}});if(state.rain&&/雨|室内/.test(text)&&/换|改|第二天/.test(text))showRainPreview();}
function changeSelection(fn,message,options=[]){closeModal();commit(()=>{fn();if(state.plan)syncPlan();say(message,options);});}
function selectTransport(id,confirmed=false){if(state.selections.selfTransport&&!confirmed){modal('把新交通加入方案比较？','你原来已订的交通不会被取消。确认后，仅更新这份规划。',`<p class="muted">已有：${esc(state.bookedTransport)}</p><div class="modal-actions"><button class="btn secondary" data-action="close">保留已订交通</button><button class="btn" data-action="confirmed-transport" data-id="${id}">采用新的交通建议</button></div>`);return;}const t=catalog().transport.find(x=>x.id===id);changeSelection(()=>{state.selections.transport=id;state.selections.selfTransport=false;},`已把${t.name}加入往返方案。${t.arrive>='17:00'?'第一天到达较晚，只安排安顿和休息。':'第一天留出到达、接驳和休息，再安排轻松体验。'}还没有产生预订。`,[opt('接着看住宿','tab','hotel'),opt('先看想去的地方','tab','spot')]);toast('交通方案已加入计划');}
function chooseRoom(pair,confirmed=false){const[id,room]=pair.split(':');if(state.selections.selfHotel&&!confirmed){modal('把新住宿加入规划？','已有酒店预订不会被取消。确认后，仅修改这份规划中的住宿选择。',`<p class="muted">已有：${esc(state.bookedHotel)}</p><div class="modal-actions"><button class="btn secondary" data-action="close">保留原来的住宿</button><button class="btn" data-action="confirmed-room" data-id="${pair}">采用新的住宿建议</button></div>`);return;}const name=catalog().hotels.find(x=>x.id===id).name;changeSelection(()=>{state.selections.hotel=id;state.selections.room=room;state.selections.selfHotel=false;},`住宿已经加入：${name} · ${room==='breakfast'?'含早餐双床房':'标准双床房'}。接下来按这个位置看看想去哪里。${!state.date?'日期未定，房型与报价先暂定。':''}`,[opt('挑几个喜欢的地方','tab','spot'),opt('查看我的选择','basket')]);toast('住宿与房型已加入');}
function toggleSpot(id,confirmed=false){let x=catalog().spots.find(x=>x.id===id),selected=state.selections.spots.includes(id);if(x.energy==='高'&&state.pace==='轻松'&&!selected&&!confirmed){modal('喜欢这里，也要照顾同行人的体力','这个地点步行和接驳较多，可以暂存为备选，或明确加入计划。',`<div class="modal-art">${art(x.kind,76)}</div><p class="muted" style="font-size:12px">${x.name}与你的少走路偏好有些冲突。若加入，我们会给它留足时间；也可以看看低体力的替代。</p><div class="modal-actions"><button class="btn secondary" data-action="favorite" data-id="${id}">先收藏</button><button class="btn soft" data-action="filter-low">看轻松备选</button><button class="btn" data-action="confirmed-spot" data-id="${id}">仍然加入</button></div>`);return;}changeSelection(()=>{if(selected)state.selections.spots=state.selections.spots.filter(x=>x!==id);else state.selections.spots.push(id);},selected?`已移出${x.name}，可以把时间留给其他体验。`:`${x.name}已经加入想去。先保留这个选择，再一起安排在哪一天，不需要立刻选完。`,[opt('安排成行程','generate'),opt('继续挑地方','tab','spot')]);toast(selected?'已从想去中移除':'已加入想去');}
function generate(){closeModal();if(!state.city){state.tab='destination';render();toast('先选择一个目的地');return;}if(!state.selections.spots.length&&!state.plan){modal('先给旅行留一个形状','还没选景点也没关系，可以先有一份留白的草稿。',`<div class="source-detail">草稿会留出到达、住宿、吃饭、休息和返程时间。想去的地方之后再加入。</div><div class="modal-actions"><button class="btn secondary" data-action="recommend">先看看推荐</button><button class="btn" data-action="generate-blank">先生成留白草稿</button></div>`);return;}commit(()=>{if(!state.plan)buildPlan();state.tab='plan';say('行程已经展开。时间里留有接驳和休息，喜欢的地方有了顺序。可以逐天看，也可以直接告诉我想改哪一段。',[opt('检查出发事项','review'),opt('第二天再轻松一点','rest-day','1'),opt('模拟下雨后的调整','simulate-rain')]);});toast('你的行程草稿已就绪');}
function applyReplacement(oldId,newId,day=state.day){closeModal();commit(()=>{state.dayPlans[day]=state.dayPlans[day].map(x=>x===oldId?newId:x);if(!state.favorites.includes(oldId))state.favorites.push(oldId);if(!state.dayPlans.flat().includes(oldId))state.selections.spots=state.selections.spots.filter(x=>x!==oldId);if(!state.selections.spots.includes(newId))state.selections.spots.push(newId);state.version++;state.tab='plan';state.day=day;say(`第${day+1}天的${catalog().spots.find(x=>x.id===oldId).name}换成了${catalog().spots.find(x=>x.id===newId).name}，相邻通行段已更新。其他天和已有交通、住宿保留。`,[opt('看看新的这一天','day',String(day)),opt('撤销这次变化','undo')]);});toast('已更新这一段，其他安排保留');}
function removePlanSpot(id){closeModal();commit(()=>{state.dayPlans=state.dayPlans.map(ids=>ids.filter(x=>x!==id));state.selections.spots=state.selections.spots.filter(x=>x!==id);if(!state.favorites.includes(id))state.favorites.push(id);state.version++;say(`${catalog().spots.find(x=>x.id===id).name}留作备选，这段时间已经改为自由安排。其余选择保留。`,[opt('撤销修改','undo')]);});toast('已留出一段自由时间');}
function restDay(index){index=Math.min(Math.max(+index,0),state.days-1);if(!state.plan){commit(()=>buildPlan());}const ids=state.dayPlans[index];if(!ids.length){closeModal();commit(()=>{state.tab='plan';state.day=index;say(`第${index+1}天已经以休息和留白为主，可以按当天状态慢慢来。`);});return;}const id=ids[ids.length-1],name=catalog().spots.find(x=>x.id===id).name;modal(`第${index+1}天，再留一点空白`,'减少一个安排，其余部分保持原样。',`<div class="diff"><div class="diff-line"><span>−</span>把${name}从日程中移出，保留为收藏备选</div><div class="diff-line"><span>＋</span>这段时间自由休息，不再安排必须完成的任务</div></div><div class="modal-actions"><button class="btn secondary" data-action="close">先保留</button><button class="btn" data-action="confirm-rest" data-id="${index}:${id}">就这样，轻松一点</button></div>`);}
function exportBook(){closeModal();if(!state.plan){generate();return;}let text=`识途 · ${state.city}旅行路书\n${dateLabel()} · ${state.days}天 · ${partyLabel()}\n出发地：${state.origin}\n节奏：${state.pace}\n\n`;state.dayPlans.forEach((ids,i)=>{text+=`第${i+1}天\n`;text+=i===0?'到达、接驳、安顿后，再轻松体验。\n':i===state.days-1?'上午慢逛，午后留足返程时间。\n':'安排休息与午后留白。\n';text+=ids.map(id=>{const x=catalog().spots.find(x=>x.id===id);return'• '+x.name+'：'+x.desc}).join('\n')+'\n\n';});const e=estimate();text+=`参考费用（全部为模拟）：交通¥${e.transport}，住宿¥${e.hotel}，门票起价¥${e.tickets}，餐饮预留¥${e.food}，市内交通¥${e.local}。合计¥${e.total}。\n\n所有数据为最终效果展示的模拟内容，不用于实际出行。加入计划不等于完成预订。`;const blob=new Blob(['\uFEFF'+text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`识途-${state.city}-${state.days}天路书.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('路书已保存，计划也会留在此浏览器');}
function showAllDays(){modal('完整路书 · '+state.city,`${dateLabel()} · ${state.days}天 · ${partyLabel()}`,`${state.dayPlans.map((_,i)=>renderDay(i)).join('<div style="height:12px"></div>')}<div class="modal-actions"><button class="btn secondary" data-action="print">打印 / 保存 PDF</button><button class="btn" data-action="export">保存文字路书</button></div>`,true);}
function showCompareCity(){modal('这三个方向，哪一个更像你？','不用马上决定，先看看体验和取舍。',`<div class="detail-section">${cities.map(c=>`<div class="diff"><div class="between"><h3 style="font-size:16px">${c.name} · ${c.headline}</h3><button class="btn soft small" data-action="choose-city" data-id="${c.name}">选这个方向</button></div><p style="margin-top:9px">适合：${c.tags.join('、')}<br>喜欢的地方：${c.pros}<br>需要留意：${c.cons}</p></div>`).join('')}</div>${sourceBlock('目的地介绍')}`);}
function selectCity(name,force=false){if(state.city===name){closeModal();toast('已经是这个目的地，可以继续规划');return;}if(state.city&&Object.values(state.selections).some(v=>Array.isArray(v)?v.length:v)&&!force){modal('换一个目的地，重新比较选择？','需求偏好和同行人保留，原城市的计划已自动保存。',`<p class="muted" style="font-size:12px">交通、住宿、景点需要按${esc(name)}重新查询。原计划不会覆盖，可以在“我的计划”里找回。</p><div class="modal-actions"><button class="btn secondary" data-action="close">保留当前目的地</button><button class="btn" data-action="confirm-city" data-id="${name}">换到${esc(name)}</button></div>`);return;}closeModal();persist();commit(()=>{if(state.city){state.id='trip-'+Date.now();state.selections={transport:null,hotel:null,room:null,spots:[],food:null,selfTransport:false,selfHotel:false};state.favorites=[];state.plan=false;state.dayPlans=[];state.version=0;}state.city=name;state.tab='transport';say(`好，这次就以${name}为目的地。我们继续确定必要信息，再把喜欢的体验安排进去。`);askNext();});}
function handle(action,id=''){
 if(action==='home'){home();return;}if(action==='saved'){closeModal();view='saved';render();return;}if(action==='scenario'){closeModal();startScenario(id);return;}if(action==='scenario-menu'){modal('换一种情况，看看识途怎样陪你规划','不同起点，会有不同的引导与安排。',`<div class="scenario-grid" style="grid-template-columns:1fr 1fr">${scenarios.map(x=>`<button class="scenario" data-action="scenario" data-id="${x.id}"><span class="scenario-icon">${ico(x.icon)}</span><span><strong>${x.title}</strong><p>${x.desc}</p></span></button>`).join('')}</div>`);return;}if(action==='start-input'){const text=$('#home-prompt').value.trim();if(!text){$('#home-prompt').focus();toast('说说想法，或从下面的情况开始');return;}let scenario=/订好|已订/.test(text)?'booked':/孩子|亲子/.test(text)?'family':/爸妈|父母|老人/.test(text)?'parents':/省钱|预算有限|一千五|1500/.test(text)?'budget':cities.some(c=>text.includes(c.name))?'parents':'explore';startScenario(scenario,text);return;}if(action==='resume'){const trip=storeRead().find(x=>x.id===id);if(trip){state=trip;undoStack=[];view='workspace';closeModal();render();toast('你的选择都在，接着规划吧');}return;}if(action==='close'){closeModal();return;}if(!state)return;
 if(action==='toggle-chat'){mobileChat=!mobileChat;render();return;}if(action==='tab'){closeModal();state.tab=id;state.filter='综合推荐';persist();render();return;}if(action==='filter'){state.filter=id;persist();render();return;}if(action==='filter-low'){closeModal();state.tab='spot';state.filter='少走路';render();return;}if(action==='send'){const input=$('#chat-input');const text=input.value;input.value='';sendText(text);return;}

 if(action==='preferences'){showPreferences();return;}if(action==='save-preferences'){const origin=$('#origin-field').value.trim(),budget=$('#budget-field').value.trim(),adults=+$('#adults-field').value,kids=+$('#kids-field').value,pace=$('#pace-field').value,interests=$('#interests-field').value.split(/[、,，]/).map(x=>x.trim()).filter(Boolean);if(!origin){toast('请补充出发城市');return;}if(budget&&+budget<=0){toast('预算填正数，或暂时留空');return;}closeModal();commit(()=>{state.origin=origin;state.budget=budget?+budget:null;state.adults=adults;state.kids=kids;state.pace=pace;state.interests=interests.length?interests:['自在旅行'];say('需求已经更新，已有选择保留。我们会按新的同行人数、节奏和预算来比较。',[opt('看看参考预算','budget-detail'),opt('重新看看推荐','recommend')]);});toast('旅行需求已更新');return;}

 if(action==='favorite'){commit(()=>{state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];});toast(state.favorites.includes(id)?'已收藏，稍后再决定':'已取消收藏');return;}if(action==='clear'){closeModal();commit(()=>{if(/^s[0-9]$/.test(id))state.selections.spots=state.selections.spots.filter(x=>x!==id);else {state.selections[id]=id.startsWith('self')?false:null;if(id==='hotel')state.selections.room=null;}if(state.plan)syncPlan();say('已更新选择，其余内容保留。',[opt('查看我的选择','basket')]);});toast('选择已更新');return;}if(action==='basket'){showBasket();return;}

 if(action==='budget-options'){showBudgetOptions();return;}if(action==='accept-budget'){closeModal();commit(()=>{const s=state.selections;if(!s.selfTransport)s.transport='t2';if(!s.selfHotel){s.hotel='h2';s.room='standard';}s.food='f1';const paid=catalog().spots.filter(x=>x.price&&s.spots.includes(x.id)).map(x=>x.id);state.favorites=[...new Set([...state.favorites,...paid])];s.spots=s.spots.filter(id=>!paid.includes(id));if(!s.spots.length)s.spots=['s0','s1','s3'];buildPlan();state.tab='plan';say(`经济方案已加入，已有预订保留。现在参考总计 ¥${estimate().total}。${state.budget&&estimate().total>state.budget?'仍然超过预算，需要继续取舍或调整天数，不能保证所有体验都保留。':'路上时间、住宿设施和用餐方式有所取舍，你可以继续调整。'}`,[opt('查看费用明细','budget-detail'),opt('撤销这次修改','undo')]);});toast('经济方案已应用');return;}if(action==='budget-detail'){modal('费用明细，分清确定与参考','所有人合计；模拟报价、起价与预留分别列出。',budgetCard()+`<div class="detail-section"><h3>怎么算的？</h3><p>往返交通：按同行人数与单人往返示例计算。<br>住宿：${Math.ceil((state.adults+state.kids)/2)}间 × ${state.days-1}晚；已有预订使用你填的总额。<br>门票：已选景点的起价示例，非指定日成交价。<br>餐饮：每日两顿正餐参考预留；没有选餐厅时使用参考额度。<br>儿童价格、实际房间入住限制与最终可售报价仍需确认。</p></div><div class="modal-actions"><button class="btn secondary" data-action="preferences">调整预算</button><button class="btn" data-action="budget-options">看看怎么省一点</button></div>`);return;}

 if(action==='map-large'){modal('今天的路线','从住宿出发，把已选地点连成一条从容的路。',mapView()+`<div class="detail-section"><h3>地点与接驳</h3><p>住宿 → ${(state.dayPlans[state.day]||[]).map(id=>catalog().spots.find(x=>x.id===id).name).join(' → ')||'自由安排'}<br>各段都留有通行与缓冲。此处为位置与路线模拟示意。</p></div><div class="modal-actions"><button class="btn" data-action="close">回到行程</button></div>`);return;}if(action==='area-guide'){modal('住哪个区域，更适合这次旅行？','先选生活方式，再比较酒店。',`<div class="detail-section">${[['休闲核心区','想随时散步和休息，住得近更从容；价格通常较高。'],['地铁沿线','住宿和通行比较均衡，适合多区域体验。'],['生活街区','费用相对低，设施更基础；需要比较去景点的时间。']].map(r=>`<div class="diff"><h3>${r[0]}</h3><p>${r[1]}</p></div>`).join('')}</div>${sourceBlock('城市区域与住宿资料')}<div class="modal-actions"><button class="btn" data-action="close">继续比较酒店</button></div>`);return;}if(action==='change-menu'){modal('这一天，你想怎样调整？','只改需要改的部分，选择和草稿都保留。',`<div class="choices"><button class="choice" data-action="rest-day" data-id="${state.day}">减少一个安排，多休息</button><button class="choice" data-action="rain-preview">下雨了，看看室内备选</button><button class="choice" data-action="tab" data-id="food">换一家餐厅</button><button class="choice" data-action="preferences">调整预算或节奏</button></div><div class="detail-section"><p>也可以直接在左侧说：“这一天想轻松一点”或“先看便宜的酒店”。</p></div>`);return;}

document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el){e.preventDefault();handle(el.dataset.action,el.dataset.id||'');}else if(e.target.classList.contains('overlay'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&(e.target.id==='chat-input'||e.target.id==='home-prompt')){e.preventDefault();handle(e.target.id==='chat-input'?'send':'start-input');}});
document.addEventListener('change',e=>{if(e.target.matches('[data-pack]')){const i=+e.target.dataset.pack;state.packed=e.target.checked?[...new Set([...state.packed,i])]:state.packed.filter(x=>x!==i);persist();}});
