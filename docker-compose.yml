# Single-process service: SQLite + an embedded vector index, no broker, no cache.
# Compose is here to make "one command and it runs" true, not to orchestrate tiers.
services:
  shitu:
    build:
      context: .
      dockerfile: Dockerfile
    image: shitu:local
    container_name: shitu
    restart: unless-stopped
    # 12-factor: configuration comes from the environment, not from files in the image.
    env_file:
      - .env
    environment:
      APP_PUBLIC_ORIGIN: http://127.0.0.1:8767
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      # One JSON object per log line, each carrying the request trace id.
      LOG_FORMAT: json
    ports:
      - "8767:8767"
    volumes:
      # sqlite workspace/job store and the published vector index: durable state.
      - shitu-runtime:/app/data/runtime
    healthcheck:
      # Liveness gate; a container that answers /api/healthz is considered up.
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8767/api/healthz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3

volumes:
  shitu-runtime:
